name: ieee-polishing
version: 1.4.0
description: >
  Declarative manifest for IEEE Transactions static/dynamic guidance. SKILL.md uses this to load only the fragments needed for the request.

always_load:
  - ../ieee-shared/core/reader-workflow.md
  - ../ieee-shared/core/paper-type-taxonomy.md
  - ../ieee-shared/core/ethics.md
  - ../ieee-shared/core/claim-centered-writing.md
  - ../ieee-shared/core/terminology-ledger.md
  - ../ieee-shared/core/ieee-transactions-contract.md
  - static/core/stance.md
  - static/core/failure-modes.md
  - static/core/output-format.md

axes:
  paper_type:
    detect: |
      Decide whether the request is algorithmic/theoretical, robotics/automation system, communication/networked control, industrial informatics, or survey/tutorial. Use research when the dominant paper type is unclear; use algorithmic only when an algorithm, model, or theorem is central.
    values:
      algorithmic: static/fragments/paper_type/algorithmic.md
      methods: static/fragments/paper_type/methods.md
      research: static/fragments/paper_type/research.md
      review: static/fragments/paper_type/review.md
    default: research
    multi: false

  section:
    detect: |
      Identify requested section(s): abstract, intro, related-work, method, experiments/results, discussion, conclusion, title, or note-to-practitioners.
    values:
      abstract: static/fragments/section/abstract.md
      intro: static/fragments/section/intro.md
      related-work: static/fragments/section/related-work.md
      method: static/fragments/section/method.md
      experiments: static/fragments/section/experiments.md
      results: static/fragments/section/results.md
      discussion: static/fragments/section/discussion.md
      conclusion: static/fragments/section/conclusion.md
      title: static/fragments/section/title.md
    multi: true

  language:
    detect: |
      Use zh-to-en for Chinese or mixed Chinese-English drafts; otherwise use en.
    values:
      en: static/fragments/language/en.md
      zh-to-en: static/fragments/language/zh-to-en.md
    default: en
    multi: false

  venue:
    detect: |
      Use the named venue when present. Map T-ASE to tase, TII to tii, TAC/TCST to tac-tcst, otherwise generic.
    values:
      generic: static/fragments/journal/generic.md
      tase: static/fragments/journal/tase.md
      tii: static/fragments/journal/tii.md
      tac-tcst: static/fragments/journal/tac-tcst.md
    default: generic
    multi: false

references:
  on_demand:
    - condition: aligning claim and evidence logic across Abstract, Introduction, Results/Experiments, Discussion, and Conclusion
      path: ../ieee-shared/core/engineering-evidence-chain.md
    - condition: polishing, restructuring, or shortening Results or full main text; allocating evidence across main text, captions, Supplementary Material, and artifacts; preventing revision accretion or claim repetition
      path: ../ieee-shared/core/main-text-discipline.md
    - condition: polishing, restructuring, or auditing Discussion; repairing finding-to-interpretation movement; calibrating modals or hedging; making limitations claim-specific; or converting generic future work into uncertainty-resolving tests
      path: ../ieee-shared/core/discussion-argument-language.md
    - condition: target venue rules, Note to Practitioners, numbered citations, double-column constraints, or reproducibility package
      path: ../ieee-shared/core/ieee-transactions-contract.md
