name: ieee-data
version: 2.0.0
description: >
  Declarative manifest for the static/dynamic split. SKILL.md uses this to
  decide which fragments to load for a data-availability request.

# Design note: ieee-data is a linear, parameterised workflow (inventory ->
# classify access route -> choose repository/identifier -> draft statement ->
# record reproduction commands -> engineering metadata audit). Its variation — journal, access route, user
# language — is handled at runtime by inline rules and the on-demand references,
# not by loading different large content bodies. There is therefore no content
# axis; the split is core (always loaded) plus on-demand references. ieee-data
# does not use the prose-oriented _shared layer (it governs reproducibility
# packaging, with its own source basis).

always_load:
  - static/core/stance.md
  - static/core/chinese-mode.md
  - static/core/workflow.md

references:
  on_demand:
    - condition: governing IEEE journal supplementary-material, DataPort, or edge-case policy logic
      path: references/policy-principles.md
    - condition: the user writes in Chinese, needs bilingual wording, or provides Chinese availability notes
      path: references/chinese-author-alignment.md
    - condition: ready-to-adapt Reproducibility Package statement patterns
      path: references/statement-patterns.md
    - condition: repository choice, accession, DOI, embargo, versioning, or dataset citation guidance
      path: references/repository-and-identifiers.md
    - condition: reproducibility-package checks, README metadata, file organization, licences, provenance, or command manifests
      path: references/reproducibility-package-checklist.md
    - condition: justify rules with official sources or check which source supports which rule
      path: references/source-basis.md
